name: Regenerate index.html

on:
    push:
        branches: [main]
        paths:
            - "hosted_files/**"
            - "templates/**"
            - "tableify.py"
            - "pyproject.toml"
            - "uv.lock"
            - ".python-version"
            - ".github/workflows/tableify.yml"
    workflow_dispatch:

permissions:
    contents: write

# Global mutex: serialize all runs of this workflow across refs so the
# "regenerate and push" job never races itself. Push-triggered runs only
# happen on main today, but a workflow_dispatch from a branch would
# otherwise be able to overlap a push run.
concurrency:
    group: tableify
    cancel-in-progress: false

jobs:
    regenerate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              # actions/checkout v6.0.2 (Node.js 24)
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: true
                  # Full history so tableify.py can read per-file commit
                  # dates via `git log` for the "Modified" column.
                  fetch-depth: 0

            - name: Set up uv
              # astral-sh/setup-uv v8.1.0 (Node.js 24)
              uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
              with:
                  enable-cache: true

            - name: Sync dependencies (locked)
              run: uv sync --locked

            - name: Smoke-test tableify.py
              run: |
                  uv run python -m py_compile tableify.py
                  uv run python -c "from jinja2 import Template; Template(open('templates/index.tpl').read())"

            - name: Run tableify.py
              run: uv run python tableify.py

            - name: Verify index.html was produced
              run: test -s index.html

            - name: Commit and push regenerated index.html
              run: |
                  if git diff --quiet -- index.html; then
                    echo "index.html is unchanged; nothing to commit."
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add index.html
                  git commit -m "chore: regenerate index.html [skip ci]"
                  git push
