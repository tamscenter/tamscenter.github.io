name: Regenerate index.html

on:
    push:
        branches: [main]
        paths:
            - "hosted_files/**"
            - "templates/**"
            - "tableify.py"
            - "requirements.txt"
            - ".github/workflows/tableify.yml"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: tableify-${{ github.ref }}
    cancel-in-progress: false

jobs:
    regenerate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              # actions/checkout v4.3.1
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
              with:
                  persist-credentials: true

            - name: Set up Python
              # actions/setup-python v5.6.0
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
              with:
                  python-version: "3.13"
                  cache: pip

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Smoke-test tableify.py
              run: |
                  python -m py_compile tableify.py
                  python -c "from jinja2 import Template; Template(open('templates/index.tpl').read())"

            - name: Run tableify.py
              run: python tableify.py

            - name: Verify index.html was produced
              run: test -s index.html

            - name: Commit and push regenerated index.html
              run: |
                  if git diff --quiet -- index.html; then
                    echo "index.html is unchanged; nothing to commit."
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add index.html
                  git commit -m "chore: regenerate index.html [skip ci]"
                  git push
